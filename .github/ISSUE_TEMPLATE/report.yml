name: Search Report
description: Submit a completed computation report for x^3 + y^3 + z^3 = 114
title: "[REPORT] "
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        Paste the report generated by the web client or local runner below.
        Do not edit the digest or task identifiers, as tampering will cause verification replay to fail.
  - type: textarea
    id: report_content
    attributes:
      label: Report Block or JSON
      description: Include the complete block between `<!-- 114-report-v1 -->` and `<!-- end-114-report -->` or raw JSON.
      placeholder: |
        <!-- 114-report-v1 -->
        contributor: your-handle
        github: your-github-account
        context: c00
        row: 0
        block: 0
        digest: ...
        combinations: ...
        <!-- end-114-report -->
    validations:
      required: true
