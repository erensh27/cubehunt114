name: Daily Leaderboard and Aggregation

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every 24 hours at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-aggregation-ledger
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recompute totals and leaderboard
        run: |
          python3 tools/aggregate_stats.py

      - name: Commit 24h updates
        run: |
          git config user.name "114-bot"
          git config user.email "bot@project114.internal"
          git add data/
          git diff --cached --quiet || git commit -m "chore: 24h leaderboard and counts aggregation"
          git push origin main
